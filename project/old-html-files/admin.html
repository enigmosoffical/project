<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPYQ Admin Panel</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 16px;
            margin-bottom: 16px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        .file-upload-label:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .file-upload-label.has-file {
            border-color: #10b981;
            background: #ecfdf5;
            color: #065f46;
        }

        .upload-icon {
            margin-right: 8px;
            font-size: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6b7280;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #4b5563;
            box-shadow: 0 10px 25px -5px rgba(107, 114, 128, 0.4);
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-weight: 500;
            text-align: center;
        }

        .message.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .user-info {
            background: #f3f4f6;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-email {
            font-weight: 600;
            color: #374151;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
                margin: 10px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                width: 56px;
                height: 56px;
                font-size: 20px;
            }
        }

        .hidden {
            display: none;
        }
        
        .auth-toggle {
            text-align: center;
            margin-top: 16px;
        }
        
        .auth-toggle button {
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            font-weight: 500;
            text-decoration: underline;
        }
        
        .auth-toggle button:hover {
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📚</div>
            <h1>SmartPYQ Admin</h1>
            <p class="subtitle">Upload Previous Year Question Papers</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <form id="authForm">
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" required placeholder="Enter your admin email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn" id="authBtn">
                    <span id="authText">Sign In</span>
                </button>
                <div class="auth-toggle">
                    <button type="button" id="toggleAuth">Need an account? Sign Up</button>
                </div>
            </form>
        </div>

        <!-- Upload Form -->
        <div id="uploadForm" class="hidden">
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button class="btn btn-secondary" id="logoutBtn" style="width: auto; padding: 8px 16px; font-size: 14px;">
                    Sign Out
                </button>
            </div>

            <div id="message"></div>

            <form id="pyqForm">
                <div class="form-group">
                    <label for="examType">Exam Type</label>
                    <select id="examType" required>
                        <option value="">Select Exam Type</option>
                        <option value="JEE Main">JEE Main</option>
                        <option value="JEE Advanced">JEE Advanced</option>
                        <option value="NEET">NEET</option>
                        <option value="CBSE Board">CBSE Board</option>
                        <option value="GATE">GATE</option>
                        <option value="CAT">CAT</option>
                        <option value="UPSC">UPSC</option>
                        <option value="State Board">State Board</option>
                        <option value="University">University</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" required>
                        <option value="">Select Subject</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Biology">Biology</option>
                        <option value="English">English</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="General Studies">General Studies</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" required min="2000" max="2030" placeholder="e.g., 2024">
                </div>

                <div class="form-group">
                    <label for="pdfFile">PDF File</label>
                    <div class="file-upload">
                        <input type="file" id="pdfFile" accept=".pdf" required>
                        <label for="pdfFile" class="file-upload-label" id="fileLabel">
                            <span class="upload-icon">📄</span>
                            <span id="fileText">Choose PDF file or drag & drop</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn" id="uploadBtn">
                    <span id="uploadText">Upload PYQ Paper</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyACm9h5se25yfKJsGyK_FFt3C7Dp8glax8",
            authDomain: "smart-pyq.firebaseapp.com",
            projectId: "smart-pyq",
            storageBucket: "smart-pyq.firebasestorage.app",
            messagingSenderId: "650913050709",
            appId: "1:650913050709:web:2beec51027e0ad16e024dc"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const storage = firebase.storage();
        const db = firebase.firestore();

        // DOM elements
        const loginForm = document.getElementById('loginForm');
        const uploadForm = document.getElementById('uploadForm');
        const authForm = document.getElementById('authForm');
        const pyqForm = document.getElementById('pyqForm');
        const messageDiv = document.getElementById('message');
        const userEmail = document.getElementById('userEmail');
        const fileInput = document.getElementById('pdfFile');
        const fileLabel = document.getElementById('fileLabel');
        const fileText = document.getElementById('fileText');
        const authBtn = document.getElementById('authBtn');
        const authText = document.getElementById('authText');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadText = document.getElementById('uploadText');
        const logoutBtn = document.getElementById('logoutBtn');
        const toggleAuthBtn = document.getElementById('toggleAuth');

        // State
        let isSignUp = false;

        // Check authentication status on page load
        auth.onAuthStateChanged(user => {
            if (user) {
                showUploadForm(user);
            } else {
                showLoginForm();
            }
        });

        function showLoginForm() {
            loginForm.classList.remove('hidden');
            uploadForm.classList.add('hidden');
            clearMessage();
            updateAuthButtonText();
        }

        function showUploadForm(user) {
            loginForm.classList.add('hidden');
            uploadForm.classList.remove('hidden');
            userEmail.textContent = user.email;
            clearMessage();
        }

        function showMessage(text, type = 'success') {
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                clearMessage();
            }, 5000);
        }

        function clearMessage() {
            messageDiv.innerHTML = '';
        }

        function setLoading(button, textElement, isLoading, loadingText, normalText) {
            if (isLoading) {
                button.disabled = true;
                textElement.innerHTML = `<span class="loading"></span>${loadingText}`;
            } else {
                button.disabled = false;
                textElement.textContent = normalText;
            }
        }

        function updateAuthButtonText() {
            if (isSignUp) {
                authText.textContent = 'Sign Up';
                toggleAuthBtn.textContent = 'Already have an account? Sign In';
            } else {
                authText.textContent = 'Sign In';
                toggleAuthBtn.textContent = 'Need an account? Sign Up';
            }
        }

        // Toggle between sign in and sign up
        toggleAuthBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            updateAuthButtonText();
        });

        // Handle file selection
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.type !== 'application/pdf') {
                    showMessage('Please select a PDF file only.', 'error');
                    fileInput.value = '';
                    return;
                }
                
                fileLabel.classList.add('has-file');
                fileText.textContent = `Selected: ${file.name}`;
            } else {
                fileLabel.classList.remove('has-file');
                fileText.textContent = 'Choose PDF file or drag & drop';
            }
        });

        // Handle drag and drop
        fileLabel.addEventListener('dragover', function(e) {
            e.preventDefault();
            fileLabel.style.borderColor = '#3b82f6';
            fileLabel.style.background = '#eff6ff';
        });

        fileLabel.addEventListener('dragleave', function(e) {
            e.preventDefault();
            fileLabel.style.borderColor = '#d1d5db';
            fileLabel.style.background = '#f9fafb';
        });

        fileLabel.addEventListener('drop', function(e) {
            e.preventDefault();
            fileLabel.style.borderColor = '#d1d5db';
            fileLabel.style.background = '#f9fafb';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type === 'application/pdf') {
                    fileInput.files = files;
                    fileLabel.classList.add('has-file');
                    fileText.textContent = `Selected: ${file.name}`;
                } else {
                    showMessage('Please select a PDF file only.', 'error');
                }
            }
        });

        // Handle authentication
        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            setLoading(authBtn, authText, true, isSignUp ? 'Creating account...' : 'Signing in...', 
                      isSignUp ? 'Sign Up' : 'Sign In');
            clearMessage();

            try {
                let userCredential;
                if (isSignUp) {
                    userCredential = await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    userCredential = await auth.signInWithEmailAndPassword(email, password);
                }

                showUploadForm(userCredential.user);
                showMessage(isSignUp ? 'Account created successfully!' : 'Successfully signed in!');
                
            } catch (error) {
                console.error('Auth error:', error);
                showMessage(error.message || 'Authentication failed. Please try again.', 'error');
            } finally {
                setLoading(authBtn, authText, false, isSignUp ? 'Creating account...' : 'Signing in...', 
                          isSignUp ? 'Sign Up' : 'Sign In');
            }
        });

        // Handle logout
        logoutBtn.addEventListener('click', async function() {
            try {
                await auth.signOut();
                showLoginForm();
                showMessage('Successfully signed out!');
            } catch (error) {
                console.error('Logout error:', error);
                showMessage('Logout failed. Please try again.', 'error');
            }
        });

        // Handle PYQ upload
        pyqForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const examType = document.getElementById('examType').value;
            const subject = document.getElementById('subject').value;
            const year = parseInt(document.getElementById('year').value);
            const file = fileInput.files[0];

            if (!file) {
                showMessage('Please select a PDF file.', 'error');
                return;
            }

            setLoading(uploadBtn, uploadText, true, 'Uploading...', 'Upload PYQ Paper');
            clearMessage();

            try {
                // Generate unique filename
                const timestamp = Date.now();
                const fileName = `${examType}_${subject}_${year}_${timestamp}.pdf`;
                
                // Upload file to Firebase Storage
                const storageRef = storage.ref();
                const fileRef = storageRef.child(`pyq-papers/${fileName}`);
                await fileRef.put(file);
                
                // Get download URL
                const fileUrl = await fileRef.getDownloadURL();

                // Insert metadata into Firestore
                await db.collection('pyq_papers').add({
                    exam_type: examType,
                    subject: subject,
                    year: year,
                    file_url: fileUrl,
                    uploaded_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                showMessage('✅ PYQ paper uploaded successfully!');
                pyqForm.reset();
                fileLabel.classList.remove('has-file');
                fileText.textContent = 'Choose PDF file or drag & drop';

            } catch (error) {
                console.error('Upload error:', error);
                showMessage(error.message || 'Upload failed. Please try again.', 'error');
            } finally {
                setLoading(uploadBtn, uploadText, false, 'Uploading...', 'Upload PYQ Paper');
            }
        });
    </script>
</body>
</html>
